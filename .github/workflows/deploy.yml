name: deploy

on:
  workflow_run:
    workflows: ["build-and-push"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, home, deploy]

    steps:
      - name: Pull and restart via docker compose
        run: |
          set -euo pipefail
          cd /opt/lampa
          docker compose -f compose.yaml pull lampa
          docker compose -f compose.yaml up -d lampa
          docker image prune -f