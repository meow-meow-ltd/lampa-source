[package]
name = "lampa-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
description = "Lampa Rust server (P0 skeleton: composition root, /healthz, graceful shutdown)"

[dependencies]
# Versions verified in the P0 research environment (review/inv/ S-files);
# Cargo.lock is committed and CI builds with --locked.
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Runtime queries only (no compile-time query macros, no build-time DB, no
# migration runner). Default features (any/macros/json) are disabled. Note: sqlx
# 0.8.6 declares sqlx-core's `migrate`/`offline` features unconditionally, so that
# module is compiled but never invoked; `sqlx-macros` is not built and the server
# never creates `_sqlx_migrations`. `sqlite` bundles SQLite (libsqlite3-sys).
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Auth (T10), pins resolved by T15 (О9): TOTP = SHA-1 / 6 digits / 30 s / window=1
# (speakeasy-compatible); device token_hash = SHA-256 hex (byte-compatible with
# Node); rand is the CSPRNG for 32-byte device tokens, hex its encoding.
hex = "=0.4.3"
rand = "=0.8.5"
sha2 = "=0.10.9"
totp-rs = "=5.7.2"

# Backup (T11), pin resolved by T15 (О9): SQLite backup API only (`backup`
# feature, default features off); no other rusqlite use. libsqlite3-sys 0.30.1 is
# shared with sqlx (bundled), so the tree keeps a single SQLite build.
rusqlite = { version = "=0.32.1", default-features = false, features = ["backup"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
