<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampa Admin</title>
    <style>
        body {
            background-color: #1b1b1b;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: #a29bfe;
        }
        .card {
            background: #2d3436;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-button {
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1e272e;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-button.active {
            background: #6c5ce7;
            border-color: #6c5ce7;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1e272e;
            color: #fff;
            flex-grow: 1;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #6c5ce7;
        }
        button {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            background: #6c5ce7;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #5f27cd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #444;
        }
        .column-name {
            color: #dfe6e9;
            font-weight: 600;
        }
        .btn-delete {
            background: #d63031;
            padding: 6px 12px;
            font-size: 14px;
        }
        .btn-delete:hover {
            background: #c0392b;
        }
        .key-col { width: 40%; font-weight: bold; color: #74b9ff; }
        .val-col { width: 35%; }
        .vis-col { width: 10%; text-align: center; font-weight: bold; }
        .act-col { width: 15%; text-align: right; }
        .id-col { width: 8%; color: #dfe6e9; }
        .sort-col { width: 12%; }
        .flag-col { width: 8%; text-align: center; font-weight: bold; }
        .btn-test {
            background: #636e72;
            padding: 6px 12px;
            font-size: 14px;
            position: relative;
            min-width: 80px;
        }
        .btn-test:hover {
            background: #535c60;
        }
        .btn-test.status-ok {
            background: #00b894;
        }
        .btn-test.status-ok:hover {
            background: #00a383;
        }
        .btn-test.status-error {
            background: #d63031;
        }
        .btn-test.status-error:hover {
            background: #c0392b;
        }
        .status-code {
            font-size: 11px;
            margin-left: 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; margin-bottom: 30px; padding-bottom: 10px;">
            <h1 style="border: none; margin: 0; padding: 0;">Lampa Administration</h1>
            <button onclick="logout()" style="background: #e17055; padding: 8px 16px;">Exit</button>
        </div>
        


        <div class="tabs">
            <button class="tab-button active" data-tab="settings">Settings</button>
            <button class="tab-button" data-tab="profiles">Profiles</button>
            <button class="tab-button" data-tab="plugins">Plugins</button>
        </div>

        <div id="tab-settings" class="tab-panel active">
            <div class="card">
                <h3>Current Settings</h3>
                <table id="settingsTable">
                    <thead>
                        <tr>
                            <th class="column-name">Key</th>
                            <th class="column-name">Value</th>
                            <th class="column-name">Visible</th>
                            <th class="column-name">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Settings will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-plugins" class="tab-panel">
            <div class="card">
                <h3>Plugins</h3>
                <div id="pluginsList"></div>
                <div class="form-group" style="margin-top: 15px;">
                    <button onclick="addPluginRow()" style="background: #00b894;">+ Add Plugin</button>
                    <button onclick="savePlugins()" style="margin-left: 10px;">Save All</button>
                </div>
            </div>
        </div>

        <div id="tab-profiles" class="tab-panel">
            <div class="card">
                <h3>Profiles</h3>
                <div class="form-group">
                    <input type="text" id="newProfileName" placeholder="Name">
                    <input type="text" id="newProfileIcon" placeholder="Icon (e.g. l_1)">
                    <input type="number" id="newProfileSort" placeholder="Sort">
                    <button onclick="createProfile()">Add</button>
                </div>
                <table id="profilesTable">
                    <thead>
                        <tr>
                            <th class="column-name">ID</th>
                            <th class="column-name">Icon</th>
                            <th class="column-name">Name</th>
                            <th class="column-name">Sort</th>
                            <th class="column-name">Main</th>
                            <th class="column-name">Child</th>
                            <th class="column-name">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Profiles will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                if (res.status === 401) {
                    window.location.reload(); // Trigger re-login flow
                    return;
                }
                const data = await res.json();
                const tbody = document.querySelector('#settingsTable tbody');
                tbody.innerHTML = '';
                
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    const isBoolItem = item.key.startsWith('menu_') || item.key.startsWith('head_');
                    tr.innerHTML = `
                        <td class="key-col">${item.key}</td>
                        <td class="val-col">
                            ${isBoolItem ? 
                                `<input type="checkbox" ${item.value == '1' ? 'checked' : ''} onchange="toggleValue('${item.key}', this.checked)">` : 
                                `<input type="text" id="val-${item.key}" value="${item.value}" style="width: 100%; box-sizing: border-box;">`
                            }
                        </td>
                        <td class="vis-col">${item.visible ? '+' : '-'}</td>
                        <td class="act-col">
                            ${isBoolItem ? '' : `<button class="btn-save" onclick="updateSetting('${item.key}')" style="margin-right: 5px; background: #00b894;">Save</button>`}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error loading settings:', e);
            }
        }

        async function toggleValue(key, checked) {
            const value = checked ? '1' : '0';
            const res = await fetch('/api/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, value })
            });

            if (!res.ok) {
                alert('Failed to update value');
                loadSettings();
            }
        }

        async function logout() {
            await fetch('/admin/logout', { method: 'POST' });
            window.location.reload();
        }



        async function updateSetting(key) {
            const value = document.getElementById('val-' + key).value;
            
            const res = await fetch('/api/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, value })
            });

            if (res.ok) {
                alert('Saved!');
                // Optional: visual feedback
            } else {
                alert('Failed to save setting');
            }
        }

        async function loadProfiles() {
            try {
                const res = await fetch('/api/profiles/all');
                if (res.status === 401) {
                    window.location.reload();
                    return;
                }
                const data = await res.json();
                const tbody = document.querySelector('#profilesTable tbody');
                tbody.innerHTML = '';

                if (!data.secuses) return;

                data.profiles.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="id-col">${item.id}</td>
                        <td class="val-col">
                            <input type="text" id="icon-${item.id}" value="${item.icon || ''}" style="width: 100%; box-sizing: border-box;">
                        </td>
                        <td class="val-col">
                            <input type="text" id="name-${item.id}" value="${item.name || ''}" style="width: 100%; box-sizing: border-box;">
                        </td>
                        <td class="sort-col">
                            <input type="number" id="sort-${item.id}" value="${item.sort || 0}" style="width: 100%; box-sizing: border-box;">
                        </td>
                        <td class="flag-col">${item.main ? '+' : '-'}</td>
                        <td class="flag-col">${item.child ? '+' : '-'}</td>
                        <td class="act-col">
                            <button class="btn-save" onclick="updateProfile(${item.id})" style="margin-right: 5px; background: #00b894;">Save</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error loading profiles:', e);
            }
        }

        async function updateProfile(id) {
            const name = document.getElementById('name-' + id).value.trim();
            const icon = document.getElementById('icon-' + id).value.trim();
            const sort = parseInt(document.getElementById('sort-' + id).value);

            const res = await fetch('/api/profiles/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, name, icon, sort })
            });

            if (res.ok) {
                alert('Saved!');
                loadProfiles();
            } else {
                alert('Failed to save profile');
            }
        }

        async function createProfile() {
            const name = document.getElementById('newProfileName').value.trim();
            const icon = document.getElementById('newProfileIcon').value.trim();
            const sortValue = document.getElementById('newProfileSort').value;
            const sort = sortValue === '' ? null : parseInt(sortValue);

            if (!name) {
                alert('Name is required');
                return;
            }

            const res = await fetch('/api/profiles/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, icon, sort })
            });

            if (res.ok) {
                document.getElementById('newProfileName').value = '';
                document.getElementById('newProfileIcon').value = '';
                document.getElementById('newProfileSort').value = '';
                loadProfiles();
            } else {
                alert('Failed to create profile');
            }
        }

        let pluginsData = [];

        async function loadPlugins() {
            try {
                const res = await fetch('/api/settings');
                if (res.status === 401) {
                    window.location.reload();
                    return;
                }
                const data = await res.json();
                const pluginsSetting = data.find(item => item.key === 'plugins');
                if (pluginsSetting && pluginsSetting.value) {
                    try {
                        pluginsData = JSON.parse(pluginsSetting.value);
                    } catch (e) {
                        pluginsData = [];
                    }
                } else {
                    pluginsData = [];
                }
                renderPluginsList();
            } catch (e) {
                console.error('Error loading plugins:', e);
            }
        }

        function renderPluginsList() {
            const container = document.getElementById('pluginsList');
            container.innerHTML = '';
            pluginsData.forEach((plugin, index) => {
                const row = document.createElement('div');
                row.className = 'form-group';
                row.innerHTML = `
                    <input type="text" value="${plugin.url || ''}" placeholder="Plugin URL" style="flex-grow: 1;" onchange="updatePluginUrl(${index}, this.value)">
                    <label style="display: flex; align-items: center; gap: 5px; color: #fff; margin: 0 10px;">
                        <input type="checkbox" ${plugin.status == 1 ? 'checked' : ''} onchange="updatePluginStatus(${index}, this.checked)">
                        Enable
                    </label>
                    <button class="btn-test" id="test-btn-${index}" onclick="testPlugin(${index})">Test</button>
                    <button class="btn-delete" onclick="removePlugin(${index})">Delete</button>
                `;
                container.appendChild(row);
            });
        }

        function addPluginRow() {
            pluginsData.push({ url: '', status: 1 });
            renderPluginsList();
        }

        function updatePluginUrl(index, value) {
            pluginsData[index].url = value;
        }

        function updatePluginStatus(index, checked) {
            pluginsData[index].status = checked ? 1 : 0;
        }

        function removePlugin(index) {
            pluginsData.splice(index, 1);
            renderPluginsList();
        }

        async function testPlugin(index) {
            const plugin = pluginsData[index];
            const btn = document.getElementById(`test-btn-${index}`);
            
            if (!plugin.url || plugin.url.trim() === '') {
                btn.textContent = 'Test';
                btn.className = 'btn-test status-error';
                btn.innerHTML = 'Test<span class="status-code">No URL</span>';
                return;
            }

            // Reset button state
            btn.textContent = 'Testing...';
            btn.className = 'btn-test';

            try {
                const res = await fetch(plugin.url, {
                    method: 'GET'
                });
                
                if (res.status === 200) {
                    btn.className = 'btn-test status-ok';
                } else {
                    btn.className = 'btn-test status-error';
                }
                btn.innerHTML = `Test<span class="status-code">${res.status}</span>`;
            } catch (error) {
                // If there's an error (e.g. CORS or network error), show it
                btn.className = 'btn-test status-error';
                btn.innerHTML = 'Test<span class="status-code">Error</span>';
                console.error('Test failed:', error);
            }
        }

        async function savePlugins() {
            const validPlugins = pluginsData.filter(p => p.url && p.url.trim() !== '');
            const value = JSON.stringify(validPlugins);
            const res = await fetch('/api/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: 'plugins', value })
            });
            if (res.ok) {
                alert('Plugins saved!');
                pluginsData = validPlugins;
                renderPluginsList();
            } else {
                alert('Failed to save plugins');
            }
        }

        function setupTabs() {
            const buttons = Array.from(document.querySelectorAll('.tab-button'));
            const panels = {
                settings: document.getElementById('tab-settings'),
                profiles: document.getElementById('tab-profiles'),
                plugins: document.getElementById('tab-plugins')
            };

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    Object.values(panels).forEach(panel => panel.classList.remove('active'));
                    const target = btn.getAttribute('data-tab');
                    panels[target].classList.add('active');
                });
            });
        }

        // Init
        setupTabs();
        loadSettings();
        loadProfiles();
        loadPlugins();
    </script>
</body>
</html>
